<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFB Spread Pick 'Em</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans">

    <!-- Header & Navigation -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-amber-500 text-slate-950 font-black p-2 rounded-lg text-xl leading-none">CFB</div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">CFB SPREAD PICK 'EM</h1>
                    <p class="text-xs text-slate-400">Weekly Spread League</p>
                </div>
            </div>

            <!-- Active User Selector -->
            <div class="flex items-center gap-2">
                <label for="userSelect" class="text-xs text-slate-400">Player:</label>
                <select id="userSelect" onchange="changeUser(this.value)" class="bg-slate-800 border border-slate-700 text-white text-sm rounded-lg p-2 focus:ring-amber-500 focus:border-amber-500">
                    <!-- Populated dynamically -->
                </select>
            </div>
        </div>

        <!-- Sync Status Banner -->
        <div id="syncStatusBanner" class="bg-slate-800 border-t border-slate-800/50 py-1 px-4 text-center text-xs text-slate-300">
            <span id="syncText">Connecting to Live Cloud...</span>
        </div>

        <!-- Tab Navigation -->
        <nav class="flex border-t border-slate-800 max-w-4xl mx-auto px-4 text-sm font-medium">
            <button onclick="switchTab('picks')" id="tab-picks" class="px-4 py-3 border-b-2 border-amber-500 text-amber-500 flex items-center gap-2">
                 Make Picks
            </button>
            <button onclick="switchTab('matrix')" id="tab-matrix" class="px-4 py-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2">
                 Group Matrix
            </button>
            <button onclick="switchTab('leaderboard')" id="tab-leaderboard" class="px-4 py-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2">
                 Standings
            </button>
            <button onclick="switchTab('commish')" id="tab-commish" class="px-4 py-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2">
                 Commish Panel
            </button>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4 pt-6">

        <!-- TAB 1: MAKE PICKS -->
        <section id="content-picks" class="tab-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Week Slate</h2>
                <button onclick="submitPicks()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm shadow transition">
                    Save & Submit Picks
                </button>
            </div>
            <div id="picksContainer" class="space-y-4">
                <!-- Games rendered here -->
            </div>
        </section>

        <!-- TAB 2: GROUP MATRIX -->
        <section id="content-matrix" class="tab-content hidden">
            <h2 class="text-xl font-bold mb-4">Group Pick Breakdown</h2>
            <div class="overflow-x-auto bg-slate-900 border border-slate-800 rounded-xl">
                <table id="matrixTable" class="w-full text-sm text-left text-slate-300">
                    <!-- Matrix rendered here -->
                </table>
            </div>
        </section>

        <!-- TAB 3: LEADERBOARD -->
        <section id="content-leaderboard" class="tab-content hidden">
            <h2 class="text-xl font-bold mb-4">Season Standings</h2>
            <div id="leaderboardContainer" class="bg-slate-900 border border-slate-800 rounded-xl p-4">
                <!-- Standings rendered here -->
            </div>
        </section>

        <!-- TAB 4: COMMISH PANEL -->
        <section id="content-commish" class="tab-content hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Commissioner Controls</h2>
                <div class="flex gap-2">
                    <button onclick="fetchEspnGames()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-3 py-2 rounded-lg text-xs transition">
                         Fetch Live ESPN Slate
                    </button>
                    <button onclick="saveSlateToFirebase()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-3 py-2 rounded-lg text-xs transition">
                         Publish Slate to Group
                    </button>
                </div>
            </div>
            <div id="commishGamesContainer" class="space-y-4">
                <!-- Commish editors rendered here -->
            </div>
        </section>

    </main>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Expose Firebase tools globally for scripts
        window.FirebaseModule = { initializeApp, getFirestore, collection, doc, setDoc, onSnapshot };
    </script>

    <!-- Main Application Logic -->
    <script>
        // 1. Global Application State
        let state = {
            currentUser: "Nick",
            players: ["Nick", "Alex", "Sam", "Chris", "Jordan"],
            currentWeek: 1,
            games: [],
            userPicks: {},
            // Hardcoded Firebase Config[cite: 1, 2]
            firebaseConfig: {
                apiKey: "AIzaSyBekrCi57PztHjlNVbUNhXu8QUUvT4rfSw",
                authDomain: "cfb-picks-36f24.firebaseapp.com",
                projectId: "cfb-picks-36f24",
                storageBucket: "cfb-picks-36f24.firebasestorage.app",
                messagingSenderId: "295757838105",
                appId: "1:295757838105:web:557a50db4ca173f36b3788",
                measurementId: "G-8DR4Q8N3E5"
            },
            db: null
        };

        // Initialize App on DOM Ready
        window.addEventListener('DOMContentLoaded', () => {
            initUserDropdown();
            tryInitFirebase();
            if (!state.games || state.games.length === 0) {
                fetchEspnGames();
            }
        });

        // 2. Firebase Initialization & Dual Live Listeners[cite: 1]
        function tryInitFirebase() {
            if (!state.firebaseConfig || !state.firebaseConfig.apiKey) return;

            try {
                const { initializeApp, getFirestore, collection, doc, onSnapshot } = window.FirebaseModule;
                const app = initializeApp(state.firebaseConfig);
                state.db = getFirestore(app);

                const statusText = document.getElementById('syncText');
                const statusBanner = document.getElementById('syncStatusBanner');
                if (statusText) statusText.innerText = "Connected to Firebase Firestore Live Cloud";
                if (statusBanner) statusBanner.classList.replace('bg-slate-800', 'bg-emerald-900/40');

                // Listener 1: Real-time Picks[cite: 1]
                onSnapshot(collection(state.db, "picks"), (snapshot) => {
                    snapshot.forEach(docSnap => {
                        const playerName = docSnap.id;
                        const data = docSnap.data();
                        if (data && data.picks) {
                            state.userPicks[playerName] = data.picks;
                        }
                    });
                    renderPicksTab();
                    renderMatrixTab();
                    renderLeaderboardTab();
                });

                // Listener 2: Real-time Shared Slate & Logo Updates[cite: 1]
                onSnapshot(doc(state.db, "settings", "currentSlate"), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.games) {
                            state.games = data.games;
                            renderPicksTab();
                            renderMatrixTab();
                            renderLeaderboardTab();
                            renderCommishTab();
                        }
                    }
                });

            } catch (e) {
                console.error("Firebase init failed:", e);
            }
        }

        // 3. Fetch Games from ESPN API (Home Team Always on Right)[cite: 1, 2]
        async function fetchEspnGames() {
            try {
                const response = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard");
                const data = await response.json();
                
                const newGames = data.events.map((event, index) => {
                    const competition = event.competitions[0];
                    const competitors = competition.competitors;
                    
                    // Lock home/away positioning
                    const homeCompetitor = competitors.find(c => c.homeAway === "home");
                    const awayCompetitor = competitors.find(c => c.homeAway === "away");
                    
                    const spreadDetails = competition.odds && competition.odds[0] && competition.odds[0].details 
                        ? competition.odds[0].details 
                        : "No Spread";

                    const gameId = `g_${index + 1}`;
                    const existingGame = state.games ? state.games.find(g => g.id === gameId) : null;

                    return {
                        id: gameId,
                        awayTeam: awayCompetitor ? awayCompetitor.team.displayName : "Away",
                        awayLogo: (existingGame && existingGame.customAwayLogo) || (awayCompetitor ? awayCompetitor.team.logo : ""),
                        awayColor: (existingGame && existingGame.awayColor) || "#1e293b",
                        
                        homeTeam: homeCompetitor ? homeCompetitor.team.displayName : "Home",
                        homeLogo: (existingGame && existingGame.customHomeLogo) || (homeCompetitor ? homeCompetitor.team.logo : ""),
                        homeColor: (existingGame && existingGame.homeColor) || "#1e293b",
                        
                        spreadDetails: spreadDetails,
                        time: event.date ? new Date(event.date).toLocaleTimeString([], { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ""
                    };
                });

                state.games = newGames;
                renderPicksTab();
                renderMatrixTab();
                renderCommishTab();
            } catch (error) {
                console.error("Failed to fetch ESPN scoreboard:", error);
            }
        }

        // 4. Render UI Components
        function renderPicksTab() {
            const container = document.getElementById('picksContainer');
            if (!container) return;

            const myPicks = state.userPicks[state.currentUser] || {};

            container.innerHTML = state.games.map((game, index) => {
                const selectedPick = myPicks[game.id];

                return `
                    <div class="game-card bg-slate-900 border border-slate-800 rounded-xl p-4">
                        <div class="game-header text-xs text-slate-400 mb-3 flex justify-between items-center">
                            <span>Game ${index + 1}</span>
                            <span class="text-amber-400 font-semibold">${game.awayTeam} @ ${game.homeTeam}</span>
                            <span>${game.time || ''}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <!-- Away Team Box (Left) -->
                            <div onclick="makePick('${game.id}', '${game.awayTeam}')" 
                                 class="team-box cursor-pointer text-center p-3 rounded-lg border-2 transition ${selectedPick === game.awayTeam ? 'border-amber-500 bg-slate-800/80' : 'border-slate-800 bg-slate-800/30 hover:border-slate-700'}">
                                <div class="w-16 h-16 mx-auto mb-2 rounded-lg flex items-center justify-center p-1.5" style="background-color: ${game.awayColor};">
                                    <img src="${game.awayLogo}" class="max-h-full max-w-full object-contain">
                                </div>
                                <div class="font-bold text-white text-sm">${game.awayTeam}</div>
                            </div>

                            <!-- Home Team Box (Right - Always Home) -->
                            <div onclick="makePick('${game.id}', '${game.homeTeam}')" 
                                 class="team-box cursor-pointer text-center p-3 rounded-lg border-2 transition ${selectedPick === game.homeTeam ? 'border-amber-500 bg-slate-800/80' : 'border-slate-800 bg-slate-800/30 hover:border-slate-700'}">
                                <div class="w-16 h-16 mx-auto mb-2 rounded-lg flex items-center justify-center p-1.5" style="background-color: ${game.homeColor};">
                                    <img src="${game.homeLogo}" class="max-h-full max-w-full object-contain">
                                </div>
                                <div class="font-bold text-white text-sm">${game.homeTeam}</div>
                            </div>
                        </div>

                        <div class="mt-3 text-center text-xs text-slate-400 bg-slate-950/50 py-1.5 rounded">
                            Spread Line: <span class="text-slate-200 font-medium">${game.spreadDetails}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderCommishTab() {
            const container = document.getElementById('commishGamesContainer');
            if (!container) return;

            container.innerHTML = state.games.map((game, index) => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                    <div class="font-bold text-sm text-slate-300">Game ${index + 1}: ${game.awayTeam} @ ${game.homeTeam}</div>
                    <div class="grid grid-cols-2 gap-4">
                        <!-- Away Customization -->
                        <div class="space-y-2 bg-slate-800/40 p-3 rounded-lg">
                            <label class="text-xs text-slate-400 block font-medium">${game.awayTeam} Settings</label>
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-slate-400">BG Color:</span>
                                <input type="color" value="${game.awayColor || '#1e293b'}" 
                                       onchange="updateGameColor('${game.id}', 'awayColor', this.value)" 
                                       class="w-8 h-8 rounded bg-transparent border-0 cursor-pointer">
                            </div>
                        </div>
                        
                        <!-- Home Customization -->
                        <div class="space-y-2 bg-slate-800/40 p-3 rounded-lg">
                            <label class="text-xs text-slate-400 block font-medium">${game.homeTeam} Settings</label>
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-slate-400">BG Color:</span>
                                <input type="color" value="${game.homeColor || '#1e293b'}" 
                                       onchange="updateGameColor('${game.id}', 'homeColor', this.value)" 
                                       class="w-8 h-8 rounded bg-transparent border-0 cursor-pointer">
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderMatrixTab() {
            const table = document.getElementById('matrixTable');
            if (!table) return;

            let headerHtml = `<thead class="bg-slate-800 text-xs uppercase text-slate-400"><tr><th class="p-3">Player</th>`;
            state.games.forEach((g, i) => headerHtml += `<th class="p-3 text-center">G${i+1}</th>`);
            headerHtml += `</tr></thead>`;

            let bodyHtml = `<tbody>`;
            state.players.forEach(p => {
                bodyHtml += `<tr class="border-b border-slate-800"><td class="p-3 font-semibold text-white">${p}</td>`;
                const pPicks = state.userPicks[p] || {};
                state.games.forEach(g => {
                    const pick = pPicks[g.id] || '-';
                    bodyHtml += `<td class="p-3 text-center text-xs">${pick}</td>`;
                });
                bodyHtml += `</tr>`;
            });
            bodyHtml += `</tbody>`;

            table.innerHTML = headerHtml + bodyHtml;
        }

        function renderLeaderboardTab() {
            const container = document.getElementById('leaderboardContainer');
            if (!container) return;
            container.innerHTML = `<div class="text-slate-400 text-sm">Standings update live as scores finalize.</div>`;
        }

        // 5. Actions & Handlers
        function makePick(gameId, teamName) {
            if (!state.userPicks[state.currentUser]) {
                state.userPicks[state.currentUser] = {};
            }
            state.userPicks[state.currentUser][gameId] = teamName;
            renderPicksTab();
        }

        async function submitPicks() {
            if (!state.db) return alert("Firebase not connected.");
            const { doc, setDoc } = window.FirebaseModule;

            try {
                const userPicks = state.userPicks[state.currentUser] || {};
                await setDoc(doc(state.db, "picks", state.currentUser), {
                    picks: userPicks,
                    updatedAt: new Date().toISOString()
                });
                alert("Picks submitted and synced!");
            } catch (e) {
                console.error("Error submitting picks:", e);
                alert("Failed to submit picks.");
            }
        }

        async function saveSlateToFirebase() {
            if (!state.db) return alert("Firebase not connected.");
            const { doc, setDoc } = window.FirebaseModule;

            try {
                await setDoc(doc(state.db, "settings", "currentSlate"), {
                    games: state.games,
                    updatedAt: new Date().toISOString()
                });
                alert("Slate & Custom Colors published to group!");
            } catch (e) {
                console.error("Error publishing slate:", e);
            }
        }

        function updateGameColor(gameId, field, colorHex) {
            const game = state.games.find(g => g.id === gameId);
            if (game) {
                game[field] = colorHex;
                renderPicksTab();
                renderCommishTab();
            }
        }

        function initUserDropdown() {
            const select = document.getElementById('userSelect');
            if (!select) return;
            select.innerHTML = state.players.map(p => 
                `<option value="${p}" ${p === state.currentUser ? 'selected' : ''}>${p}</option>`
            ).join('');
        }

        function changeUser(newUser) {
            state.currentUser = newUser;
            renderPicksTab();
            renderMatrixTab();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('border-amber-500', 'text-amber-500');
                el.classList.add('border-transparent', 'text-slate-400');
            });

            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            const activeNav = document.getElementById(`tab-${tabName}`);
            activeNav.classList.remove('border-transparent', 'text-slate-400');
            activeNav.classList.add('border-amber-500', 'text-amber-500');
        }
    </script>
</body>
</html>
